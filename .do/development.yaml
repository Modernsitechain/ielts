# DigitalOcean App Platform spec: environment "development" (api + web + admin).
# Deploys on every push to the `development` branch. Setup: docs/deployment.md.
#   App: ielts-development (doctl apps list)
#   Update: doctl apps update <app-id> --spec .do/development.yaml
#
# Secrets: values marked EV[...] are encrypted by App Platform and can only be
# decrypted by this app, so they are safe to keep here. The database URL and CA
# certificate are injected from the attached database (${db.…}).
# WORKOS_CLIENT_ID isn't secret (it is visible in the sign-in URL).
name: ielts-development
region: sgp

services:
  - name: api
    github:
      repo: Modernsitechain/ielts
      branch: development
      deploy_on_push: true
    source_dir: /
    dockerfile_path: apps/api/Dockerfile
    http_port: 4000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /health
    envs:
      - key: APP_ENV
        value: development
        scope: RUN_TIME
      - key: PORT
        value: "4000"
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      - key: DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME
      # WorkOS Staging environment (same as local).
      - key: WORKOS_CLIENT_ID
        value: client_01M5WD4X81TY1HC9BWFT0A7MDN
        scope: RUN_TIME
      - key: WORKOS_API_KEY
        value: EV[1:tXMHYRbR59+btjW2FGySishMZkSBvquu:/P0IABszzs7+RiDTgJ2E2AZ1TrSMvSQy/O9v6c8PFHIoJzHaUW7Ik8et7ZQta42rzrcwqJ0g3N21e1bJhGkosHMhbAKNkM0YHlvN75+bRg6qjRZtB0nkIjaqhSv7SYD4O+w9]
        type: SECRET
        scope: RUN_TIME

  - name: web
    github:
      repo: Modernsitechain/ielts
      branch: development
      deploy_on_push: true
    source_dir: /
    dockerfile_path: apps/web/Dockerfile
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /
    envs:
      - key: APP_ENV
        value: development
        scope: RUN_TIME
      # Private network inside the app: http://<component>:<port>.
      - key: API_URL
        value: http://api:4000
        scope: RUN_TIME
      - key: WORKOS_CLIENT_ID
        value: client_01M5WD4X81TY1HC9BWFT0A7MDN
        scope: RUN_TIME
      - key: WORKOS_COOKIE_PASSWORD
        value: EV[1:AwNBpbtGaTD0vktQy2TOvdAS0VQIkn/2:YoEIFL6wurcilSwlJxddJ2ENSy1C2nse+0DZ9SbQ+ojGu4GkzkxK+5zVcNDgU6DH7o1QGg+OXOhIBANt]
        type: SECRET
        scope: RUN_TIME
      # Inlined by Next.js at build time, so also a build arg (see Dockerfile).
      - key: NEXT_PUBLIC_WORKOS_REDIRECT_URI
        value: https://ielts-development-9acd2.ondigitalocean.app/callback
        scope: RUN_AND_BUILD_TIME

  - name: admin
    github:
      repo: Modernsitechain/ielts
      branch: development
      deploy_on_push: true
    source_dir: /
    dockerfile_path: apps/admin/Dockerfile
    http_port: 3001
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    # No HTTP health check: every admin page redirects to sign-in, so App
    # Platform's default TCP check is used.
    envs:
      - key: APP_ENV
        value: development
        scope: RUN_TIME
      - key: API_URL
        value: http://api:4000
        scope: RUN_TIME
      - key: WORKOS_CLIENT_ID
        value: client_01M5WD4X81TY1HC9BWFT0A7MDN
        scope: RUN_TIME
      # Different from web's: both apps share this domain.
      - key: WORKOS_COOKIE_PASSWORD
        value: EV[1:wkO33jEfk/XmQeIoxGT4EBaM/LNln/3v:RSG1C03MDmJGJjC3cbHTUZA7u7qBU6ARPVm7i2hhTGmR77eJdVfqVval7niU9JS++bPqb2TTyW/Szojy]
        type: SECRET
        scope: RUN_TIME
      - key: WORKOS_COOKIE_NAME
        value: wos-admin-session
        scope: RUN_TIME
      - key: NEXT_PUBLIC_WORKOS_REDIRECT_URI
        value: https://ielts-development-9acd2.ondigitalocean.app/admin/callback
        scope: RUN_AND_BUILD_TIME

jobs:
  # Runs before each new version goes live; a failed migration stops the deploy.
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: Modernsitechain/ielts
      branch: development
      deploy_on_push: true
    source_dir: /
    dockerfile_path: apps/api/Dockerfile
    run_command: node dist/database/migrate.js
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: APP_ENV
        value: development
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      - key: DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME

databases:
  # Existing Managed PostgreSQL cluster; one database and user per environment.
  - name: db
    engine: PG
    production: true
    cluster_name: ielts-db
    db_name: ielts_mock_development
    db_user: ielts_development

# Most specific prefixes first.
ingress:
  rules:
    # Development only: public API for `pnpm dev:remote` (prefix stripped,
    # /api/health → /health). Production keeps the API private.
    - component:
        name: api
      match:
        path:
          prefix: /api
    - component:
        name: admin
        preserve_path_prefix: true
      match:
        path:
          prefix: /admin
    - component:
        name: web
      match:
        path:
          prefix: /
