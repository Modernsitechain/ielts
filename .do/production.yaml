# DigitalOcean App Platform spec: environment "production" (api + web).
# Deploys on every push to the `main` branch. Setup: docs/deployment.md.
#   Update: doctl apps update <app-id> --spec .do/production.yaml
# No admin and no public API in production until WorkOS login exists.
name: ielts-production
region: sgp

services:
  - name: api
    github:
      repo: Modernsitechain/ielts
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: apps/api/Dockerfile
    # Private only: reachable by web as http://api:4000, not from the internet.
    internal_ports:
      - 4000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /health
      port: 4000
    envs:
      - key: APP_ENV
        value: production
        scope: RUN_TIME
      - key: PORT
        value: "4000"
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      - key: DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME

  - name: web
    github:
      repo: Modernsitechain/ielts
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: apps/web/Dockerfile
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /
    envs:
      - key: APP_ENV
        value: production
        scope: RUN_TIME
      - key: API_URL
        value: http://api:4000
        scope: RUN_TIME

jobs:
  # Runs before each new version goes live; a failed migration stops the deploy.
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: Modernsitechain/ielts
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: apps/api/Dockerfile
    run_command: node dist/database/migrate.js
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: APP_ENV
        value: production
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      - key: DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME

databases:
  - name: db
    engine: PG
    production: true
    cluster_name: ielts-db
    db_name: ielts_mock
    db_user: ielts_production

ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
