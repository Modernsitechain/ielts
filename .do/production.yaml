# DigitalOcean App Platform spec: environment "production" (api + web).
# Deploys on every push to the `main` branch. Setup: docs/deployment.md.
#   Update: doctl apps update <app-id> --spec .do/production.yaml
# No public API. Admin isn't deployed here yet (possible now that it has WorkOS
# login). Placeholders __…__ are filled when the app is created; see
# docs/deployment.md (Tahap 5). WorkOS: the Production environment's keys.
name: ielts-production
region: sgp

services:
  - name: api
    github:
      repo: Modernsitechain/ielts
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: apps/api/Dockerfile
    # Private only: reachable by web as http://api:4000, not from the internet.
    internal_ports:
      - 4000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /health
      port: 4000
    envs:
      - key: APP_ENV
        value: production
        scope: RUN_TIME
      - key: PORT
        value: "4000"
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      - key: DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME
      - key: WORKOS_CLIENT_ID
        value: __WORKOS_CLIENT_ID__
        scope: RUN_TIME
      - key: WORKOS_API_KEY
        value: __WORKOS_API_KEY__
        type: SECRET
        scope: RUN_TIME

  - name: web
    github:
      repo: Modernsitechain/ielts
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: apps/web/Dockerfile
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /
    envs:
      - key: APP_ENV
        value: production
        scope: RUN_TIME
      - key: API_URL
        value: http://api:4000
        scope: RUN_TIME
      - key: WORKOS_CLIENT_ID
        value: __WORKOS_CLIENT_ID__
        scope: RUN_TIME
      - key: WORKOS_COOKIE_PASSWORD
        value: __WEB_COOKIE_PASSWORD__
        type: SECRET
        scope: RUN_TIME
      # Inlined by Next.js at build time, so also a build arg (see Dockerfile).
      - key: NEXT_PUBLIC_WORKOS_REDIRECT_URI
        value: __APP_URL__/callback
        scope: RUN_AND_BUILD_TIME

jobs:
  # Runs before each new version goes live; a failed migration stops the deploy.
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: Modernsitechain/ielts
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: apps/api/Dockerfile
    run_command: node dist/database/migrate.js
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: APP_ENV
        value: production
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      - key: DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME

databases:
  - name: db
    engine: PG
    production: true
    cluster_name: ielts-db
    db_name: ielts_mock
    db_user: ielts_production

ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
